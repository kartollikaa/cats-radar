org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.daemon.jvmargs=-Xmx2g
kotlin.code.style=official
android.useAndroidX=true
# The GitHub repository, owner/name, whose release list the app checks for updates.
catsradar.updateRepository=kartollikaa/cats-radar
# The API that lists the repository's releases; a verification build points it at a local feed.
catsradar.updateApi=https://api.github.com
