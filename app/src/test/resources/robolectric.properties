# Pinned below compileSdk/targetSdk 37 (Robolectric needs Java 21 to shadow it; this machine has
# JDK 17) -- DI resolution here runs at API 34, fine only as long as no resolved type is API-gated.
sdk=34

# A plain Application, not the manifest's CatsRadarApplication: its onCreate() starts Koin and
# initializes WorkManager, so every test after the first would collide with the one before it.
# A test that wants the real thing asks for it with its own @Config.
application=android.app.Application
