[versions]
app-versionCode = "5"
app-versionName = "1.3.0-beta"

android-compileSdk = "37"
android-minSdk = "29"
android-targetSdk = "37"

agp = "9.3.0"
kotlin = "2.4.20"
detekt = "1.23.8"
compose-rules-detekt = "0.4.28" # 0.5.0+ requires detekt 2.0.0-alpha, we're still on 1.23.8
konsist = "0.17.3"
junit = "4.13.2"
compose-bom = "2026.09.00"
# Overrides the BOM until its material3 has SplitButtonLayout, then goes. Pick the newest alpha whose
# compose-foundation floor the BOM already meets, so the rest of Compose stays on the BOM.
compose-material3 = "1.5.0-alpha27"
androidx-activity = "1.13.0"
androidx-core = "1.19.0"
kotlinx-coroutines = "1.11.0"
# The "-0.6.x-compat" suffix ships kotlinx.datetime.Instant/Clock as type aliases to
# kotlin.time.Instant/Clock (docs/rules/date-time.md); the plain 0.8.0 artifact omits them.
kotlinx-datetime = "0.8.0-0.6.x-compat"
kotlinx-collections-immutable = "0.5.1"
# Room's current stable major renamed its group/plugin id to androidx.room3 (room3-runtime,
# room3-compiler, plugin id "androidx.room3"); the pre-rename androidx.room artifacts stayed at 2.x.
room = "3.0.3"
androidx-sqlite = "2.7.1"
ksp = "2.3.12"
robolectric = "4.17"
androidx-exifinterface = "1.4.1"
androidx-datastore = "1.2.1"
androidx-glance = "1.2.0"
maplibre-compose = "0.17.0"
coil = "3.3.0"
telephoto = "0.19.0"
androidx-test-core = "1.7.0"
androidx-test-ext-junit = "1.3.0"
androidx-lifecycle = "2.11.0"
# lifecycle-viewmodel-navigation3 has never had a stable release; pinned to the alpha that ships
# alongside navigation3 1.2.0-rc01 (same release date, most likely to be mutually compatible).
androidx-lifecycle-viewmodel-navigation3 = "2.12.0-alpha03"
androidx-navigation3 = "1.2.0-rc01"
kotlinx-serialization = "1.10.0"
koin-bom = "4.2.2"
turbine = "1.2.1"
play-services-location = "21.4.0"
androidx-work = "2.11.2"
# WorkManager 2.11.2's internal WorkDatabase still extends the pre-rename androidx.room
# RoomDatabase (runtime-scoped in its POM, so Gradle omits it from the compile classpath);
# work-testing tests that reach WorkManagerImpl.workDatabase need it added explicitly to resolve.
androidx-room-legacy = "2.7.0"
firebase-bom = "34.19.0"
google-services = "4.5.0"
firebase-crashlytics-gradle = "3.0.8"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "compose-material3" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinx-collections-immutable" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
compose-rules-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "compose-rules-detekt" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
junit = { module = "junit:junit", version.ref = "junit" }
room-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }
room-testing = { module = "androidx.room3:room3-testing", version.ref = "room" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidx-sqlite" }
androidx-sqlite-bundled-jvm = { module = "androidx.sqlite:sqlite-bundled-jvm", version.ref = "androidx-sqlite" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "androidx-exifinterface" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore" }
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "androidx-glance" }
androidx-glance-material3 = { module = "androidx.glance:glance-material3", version.ref = "androidx-glance" }
androidx-glance-appwidget-testing = { module = "androidx.glance:glance-appwidget-testing", version.ref = "androidx-glance" }
maplibre-compose = { module = "org.maplibre.compose:maplibre-compose", version.ref = "maplibre-compose" }
maplibre-compose-runtime-opengl = { module = "org.maplibre.compose:maplibre-compose-runtime-opengl-android", version.ref = "maplibre-compose" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
telephoto-zoomable-image-coil3 = { module = "me.saket.telephoto:zoomable-image-coil3", version.ref = "telephoto" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle-viewmodel-navigation3" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "androidx-navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "androidx-navigation3" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin-bom" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose" }
koin-test = { module = "io.insert-koin:koin-test" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "play-services-location" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "kotlinx-coroutines" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "androidx-work" }
androidx-room-legacy-runtime = { module = "androidx.room:room-runtime", version.ref = "androidx-room-legacy" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }

# build-logic classpath
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
detekt-gradlePlugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room3", version.ref = "room" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebase-crashlytics-gradle" }
